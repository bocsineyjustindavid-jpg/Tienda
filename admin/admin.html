<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de administración</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="loginView" class="login-box card" hidden>
    <h1 class="admin-title">Administración</h1>
    <form id="loginForm" class="form" autocomplete="on">
      <label>Usuario
        <input name="username" required maxlength="50" autocomplete="username">
      </label>
      <label>Contraseña
        <input name="password" type="password" required maxlength="200" autocomplete="current-password">
      </label>
      <button class="btn" type="submit">Entrar</button>
      <p class="status" id="loginStatus" role="status"></p>
    </form>
  </div>

  <div id="panel" class="admin-wrap" hidden></div>

  <script src="/admin/login.js"></script>
</body>
</html>
